services:
  app:
    build: .
    image: grasshopper-pasture:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Every value below is optional. With none of them set the app uses the
      # in-process room store and the public STUN list.
      PORT: "3000"
      ROOM_SECRET: "${ROOM_SECRET:-}"
      STUN_URLS: "${STUN_URLS:-}"
      TURN_URL: "${TURN_URL:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
