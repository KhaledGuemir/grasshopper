# Minimal coturn configuration for Grasshopper Pasture.
#
# 1. Replace REPLACE_WITH_PUBLIC_IP and the shared secret below.
# 2. Open UDP/TCP 3478 and the relay range 49160-49200 in the firewall.
# 3. Start it with: docker compose -f deploy/coturn/docker-compose.yml up -d
# 4. Point the app at it:
#      TURN_URL=turn:REPLACE_WITH_PUBLIC_IP:3478
#      TURN_SECRET=<the same shared secret>
#
# This gives players a relay path without any paid TURN provider or API key.
# TURN only carries traffic for peers that cannot connect directly.

listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_A_LONG_RANDOM_SECRET
realm=grasshopper
external-ip=REPLACE_WITH_PUBLIC_IP
min-port=49160
max-port=49200
no-multicast-peers
no-cli
no-tls
no-dtls
