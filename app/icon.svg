<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="frame">
      <rect width="64" height="64" rx="12"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6daf0"/>
      <stop offset="1" stop-color="#dcf4fc"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8f472"/>
      <stop offset="1" stop-color="#79d94b"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="64" height="64" fill="url(#sky)"/>

    <!-- distant mountain -->
    <path d="M0 24 L14 11 L27 17 L45 6 L64 15 L64 38 L0 38 Z" fill="#a9d2df"/>
    <path d="M0 29 L11 20 L24 26 L43 16 L64 24 L64 38 L0 38 Z" fill="#b9dde8"/>

    <!-- ground -->
    <rect y="37" width="64" height="27" fill="url(#grass)"/>
    <rect y="37" width="64" height="2" fill="#8ee35f"/>

    <!-- pine trees -->
    <g>
      <rect x="8.6" y="30" width="1" height="5" fill="#7a4a2a"/>
      <path d="M9.1 20 L4.8 29 L13.4 29 Z" fill="#2f7d3f"/>
      <path d="M9.1 24.5 L3.9 33 L14.3 33 Z" fill="#3c9950"/>
    </g>
    <g>
      <rect x="57.2" y="29" width="0.9" height="4.5" fill="#7a4a2a"/>
      <path d="M57.7 21 L53.9 28.8 L61.5 28.8 Z" fill="#2f7d3f"/>
      <path d="M57.7 24.8 L53.2 32 L62.2 32 Z" fill="#3c9950"/>
    </g>

    <!-- sheep -->
    <g>
      <ellipse cx="58.2" cy="45.4" rx="2.4" ry="1.6" fill="#f4f6f0"/>
      <circle cx="56.4" cy="44.7" r="0.9" fill="#4a4f55"/>
      <rect x="57.1" y="46.7" width="0.6" height="1.2" fill="#4a4f55"/>
      <rect x="59" y="46.7" width="0.6" height="1.2" fill="#4a4f55"/>
    </g>

    <!-- truck shadow -->
    <ellipse cx="31" cy="52.4" rx="23" ry="2.6" fill="#4f9c34" opacity="0.45"/>

    <!-- truck -->
    <g>
      <!-- side body -->
      <path d="M8.5 33 L27 33 L28.5 24 L41 24 L45.5 30 L48 30 L48 43.5 L8.5 43.5 Z" fill="#2b6fc9"/>
      <!-- lighter top edges -->
      <path d="M8.5 33 L27 33 L26.6 31.4 L8.5 31.4 Z" fill="#4a8fe0"/>
      <path d="M28.5 24 L41 24 L40.6 22.5 L29.1 22.5 Z" fill="#4a8fe0"/>
      <path d="M45.5 30 L48 30 L48 28.6 L45.7 28.6 Z" fill="#4a8fe0"/>

      <!-- front face -->
      <path d="M48 30 L53.5 31.2 L53.5 43.5 L48 43.5 Z" fill="#4a90dd"/>
      <!-- headlights -->
      <path d="M48.9 33.2 L50.8 34.1 L50.8 36 L48.9 35.2 Z" fill="#ffffff"/>
      <path d="M51.4 34.4 L53.2 35.2 L53.2 37.1 L51.4 36.3 Z" fill="#ffffff"/>
      <!-- grille -->
      <path d="M48.8 36.6 L53.3 37.4 L53.3 41.6 L48.8 41.6 Z" fill="#1b1f26"/>
      <!-- bumper -->
      <path d="M48 42 L53.5 42 L53.5 43.6 L48 43.6 Z" fill="#2a2f36"/>

      <!-- windows -->
      <path d="M30 25.9 L39.6 25.9 L42.9 30.3 L30 30.3 Z" fill="#152a44"/>
      <path d="M30.8 26.6 L39.2 26.6 L41.9 29.6 L30.8 29.6 Z" fill="#1f3d5e"/>
      <!-- door seam -->
      <path d="M30 30.3 L30 33" stroke="#245da8" stroke-width="0.7"/>
      <path d="M40.8 33 L40.8 43.4" stroke="#245da8" stroke-width="0.7"/>
      <!-- handle -->
      <rect x="38.2" y="31.6" width="2.4" height="1" rx="0.4" fill="#1c4f93"/>
      <!-- taillight -->
      <rect x="8.9" y="34.6" width="1.4" height="2.4" rx="0.3" fill="#c93a30"/>

      <!-- lower body shade -->
      <rect x="8.5" y="41.6" width="39.5" height="1.9" fill="#245da8"/>

      <!-- wheel arches -->
      <circle cx="17.5" cy="46" r="7.3" fill="#1f4f8f"/>
      <circle cx="42.5" cy="46" r="7.3" fill="#1f4f8f"/>

      <!-- wheels -->
      <circle cx="17.5" cy="46" r="6.2" fill="#15181d"/>
      <circle cx="42.5" cy="46" r="6.2" fill="#15181d"/>
      <circle cx="17.5" cy="46" r="2.5" fill="#7f858e"/>
      <circle cx="42.5" cy="46" r="2.5" fill="#7f858e"/>
      <circle cx="17.5" cy="46" r="1" fill="#3a3f46"/>
      <circle cx="42.5" cy="46" r="1" fill="#3a3f46"/>
    </g>
  </g>
</svg>
